name: OPA Threat Modeling CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Install OPA
        run: |
          curl -L -o opa https://openpolicyagent.org/downloads/v0.56.0/opa_linux_amd64_static
          chmod 755 opa
          sudo mv opa /usr/local/bin/

      - name: Run OPA Unit Tests
        run: |
          echo "Running OPA unit tests..."
          opa test policies/ -v

      - name: Check OPA Coverage
        run: |
          echo "Generating coverage report..."
          opa test policies/ -v --coverage --format json > coverage.json
          COVERAGE=$(jq '.coverage' coverage.json)
          echo "Total Coverage: ${COVERAGE}%"
          if (( $(echo "$COVERAGE < 80.0" | bc -l) )); then
            echo "Coverage is below 80%. Failing build."
            exit 1
          fi
          echo "Coverage is adequate."

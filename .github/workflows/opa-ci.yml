name: OPA STRIDE Policy Tests

on:
  push:
    branches: [master]
  pull_request:
    paths:
      - 'policies/**'

jobs:
  opa-test:
    name: OPA Policy Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install OPA
        run: |
          curl -L -o opa https://openpolicyagent.org/downloads/v0.65.0/opa_linux_amd64_static
          chmod +x opa && sudo mv opa /usr/local/bin/

      - name: Run all OPA tests
        run: opa test policies/ -v --explain fails

      - name: Check coverage >= 80%
        run: |
          opa test policies/ --coverage --format=json | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          cov = d.get('coverage', 0)
          print(f'Policy coverage: {cov:.1f}%')
          sys.exit(0 if cov >= 80 else 1)
          "

      - name: Validate policy files
        run: opa check policies/
